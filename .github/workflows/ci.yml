name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check scripts/codebase-memory-client.mjs
      - run: node --check scripts/install-codebase-memory-clients.mjs
      - run: node --check scripts/codebase-memory-session.mjs
      - run: npm install -g codebase-memory-mcp@0.11.0
      - run: npm run test:mcp
